schema: 1
voice:
  backend: auto
  threads: 4
  tts_enabled: false
  tts_prewarm: false
  preview_interval_seconds: 1.0
  refine: true
  maximum_audio_seconds: 30
  # 0 keeps the model default; set 256 only for a measured candidate run.
  asr_max_new_tokens: 0
  vad_enabled: true
  vad_threshold: 0.35
  # Keep off: the current paired physical screen regressed recognition accuracy.
  hgtcrn_enabled: false
  # Empty paths use the matching files in project/models/frontend.
  vad_model: ""
  hgtcrn_model: ""
  # Empty model paths keep project-local models discovery and HMI_MODEL_DIR.
  asr_model: ""
  tts_model: ""
rules:
  file: rules/voice.json
hotkeys:
  hold: Ctrl+Alt
  toggle: Ctrl+Shift+M
logging:
  level: info
  file: logs/hmi.log
  max_size_mb: 5
  max_files: 3
  console: false
devices:
  logging_enabled: true
  poll_interval_seconds: 10
